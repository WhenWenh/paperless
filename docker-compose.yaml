include:
  - compose-infra.yaml

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      STORAGE_TYPE: ${STORAGE_TYPE}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_REGION: ${STORAGE_REGION}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      filestore:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - paperless_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - paperless-storage:/tmp/paperless

  webui:
    build: ./webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEBUI_PORT}:80"
    depends_on:
      - api
    networks:
      - paperless_network

  ocr:
    build:
      context: .
      dockerfile: ocr/Dockerfile

    restart: unless-stopped

    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      STORAGE_TYPE: ${STORAGE_TYPE}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_REGION: ${STORAGE_REGION}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}

    depends_on:
      rabbitmq:
        condition: service_healthy
      filestore:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8082/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - paperless-storage:/tmp/paperless

    networks:
      - paperless_network

  # ocr-go:
  #   build:
  #     context: ./ocr-go
  #     dockerfile: Dockerfile

  #   restart: unless-stopped

  #   environment:
  #     RABBITMQ_HOST: rabbitmq
  #     RABBITMQ_PORT: "5672"

  #     RABBITMQ_USER: ${RABBITMQ_USER}
  #     RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

  #   depends_on:
  #     rabbitmq:
  #       condition: service_healthy

  #   healthcheck:
  #     test: [ "CMD", "wget", "-qO-", "http://localhost:8082/health" ]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 10s

  #   volumes:
  #     - paperless-storage:/tmp/paperless:ro

  #   networks:
  #     - paperless_network

  genai:
    build:
      context: .
      dockerfile: genai/Dockerfile

    restart: unless-stopped

    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

    depends_on:
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://localhost:8083/actuator/health"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

    networks:
      - paperless_network

  newman:
    build:
      context: ./_postman
    restart: unless-stopped
    depends_on:
      keycloak:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - paperless_network
    volumes:
      - ./_postman:/etc/newman:ro
    entrypoint: ["tail", "-f", "/dev/null"]
    command: []

volumes:
  paperless-storage:
