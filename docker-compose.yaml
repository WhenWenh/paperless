include:
  - compose-infra.yaml

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - paperless_network
    volumes:
      - paperless-storage:/tmp/paperless

  webui:
    build: ./webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEBUI_PORT}:80"
    depends_on:
      - api
    networks:
      - paperless_network

volumes:
  paperless-pg-data:
  paperless-storage:

networks:
  paperless_network: