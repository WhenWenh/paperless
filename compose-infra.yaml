services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
    volumes:
      - paperless-pg-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro,Z
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paperless_network

  rabbitmq:
    image: rabbitmq:4.3.2-management-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGE_PORT}:15672"
      - "127.0.0.1:${RABBITMQ_PORT}:5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paperless_network

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT}:8080"
    environment:
      KC_HEALTH_ENABLED: true
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT}
      KC_HOSTNAME_STRICT: false
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./paperless-realm.json:/opt/keycloak/data/import/paperless-realm.json:ro,Z
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'echo > /dev/tcp/127.0.0.1/9000'"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s
    networks:
      - paperless_network