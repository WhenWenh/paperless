## librefs
  filestore:
    build:
      context: ./_filestore
    container_name: paperless-filestore
    restart: unless-stopped
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - filestore-data:/data
    networks:
      - paperless_network

volumes:
  paperless-pg-data:
  keycloak-data:
  rabbitmq-data:
  filestore-data:
  elasticsearch-data:

networks:
  paperless_network: