<h2>DashboardComponent</h2>

@if (loading()) {
  <p>Tags werden geladen …</p>
} @else if (error()) {
  <p>{{ error() }}</p>
} @else {
  <h3>Tags</h3>

  <ul>
    @for (tag of tags(); track tag.id) {
      <li>{{ tag.name }}</li>
    } @empty {
      <li>Noch keine Tags vorhanden.</li>
    }
  </ul>
}
