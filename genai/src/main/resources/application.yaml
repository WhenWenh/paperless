server:
  port: 8083

spring:
  application:
    name: genai

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}

  elasticsearch:
    uris: http://elasticsearch:9200

management:
  endpoints:
    web:
      exposure:
        include: health