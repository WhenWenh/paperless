server:
  port: 8081

spring:
  application:
    name: Paperless API
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 101MB

  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/paperless/protocol/openid-connect/certs

logging:
  level:
    at.fhtw.swen.paperless: DEBUG
    org.springframework: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36}.%M - %msg%n"

paperless:
  upload:
    max-file-size: 100MB
    max-title-length: 20
    allowed-content-types:
      - application/pdf
      - image/jpeg
      - image/png
      - text/plain
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.ms-excel
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
