openapi: 3.1.0
info:
  title: Paperless API
  version: 0.2.0
servers:
  - url: http://localhost:8081
paths:
  /api/v1/documents:
    post:
      tags:
        - Documents
      summary: Create a document metadata record
      operationId: createDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentRequest"
      responses:
        "201":
          description: Document created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"

    get:
      tags:
        - Documents
      summary: List all documents
      operationId: getAllDocuments
      responses:
        "200":
          description: List of documents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentResponse"

  /api/v1/documents/{id}:
    get:
      tags:
        - Documents
      summary: Get a document by ID
      operationId: getDocument
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "404":
          description: Document not found.


components:
  schemas:
    CreateDocumentRequest:
      type: object
      required:
        - title
        - originalFilename
        - contentType
        - fileSize
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '\S'
          example: Testrechnung
        originalFilename:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '\S'
          example: rechnung.pdf
        contentType:
          type: string
          minLength: 1
          maxLength: 127
          pattern: '\S'
          example: application/pdf
        fileSize:
          type: integer
          format: int64
          minimum: 0
          example: 1024

    DocumentResponse:
      type: object
      required:
        - id
        - title
        - originalFilename
        - contentType
        - fileSize
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        originalFilename:
          type: string
        contentType:
          type: string
        fileSize:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time